# /etc/nginx/sites-available/farmacia   (enlazar en sites-enabled y recargar Nginx)
# Reemplace farmacia.midominio.cl. Luego ejecute:  sudo certbot --nginx -d farmacia.midominio.cl
server {
    listen 80;
    server_name farmacia.midominio.cl;

    client_max_body_size 6M;          # recetas escaneadas (límite de la app: 5 MB)

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;                      # la app lo usa para auditoría
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
