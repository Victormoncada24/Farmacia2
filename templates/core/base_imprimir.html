<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>{% block titulo %}Documento{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body{background:#f0f0f0} .hoja{background:#fff;max-width:820px;margin:20px auto;padding:32px;box-shadow:0 0 8px #0003}
  .encabezado{border-bottom:4px solid #c8102e;padding-bottom:10px;margin-bottom:18px}
  .logo{display:inline-block;width:26px;height:26px;background:#e4002b;vertical-align:middle;margin-right:8px}
  .firma{margin-top:70px;border-top:1px solid #000;width:240px;text-align:center;font-size:.85rem}
  @media print{body{background:#fff}.hoja{box-shadow:none;margin:0;max-width:none}.no-imprimir{display:none!important}}
</style></head>
<body>
<div class="text-center mt-3 no-imprimir"><button class="btn btn-danger" onclick="window.print()">Imprimir</button>
 <button class="btn btn-outline-secondary" onclick="history.back()">Volver</button></div>
<div class="hoja">
  <div class="encabezado d-flex justify-content-between align-items-center">
    <div><span class="logo"></span><strong class="fs-4">inacap</strong><div class="small text-muted">{{ APP_NOMBRE }} · INACAP</div></div>
    <div class="text-end"><div class="fs-5 fw-bold">{% block doc_titulo %}{% endblock %}</div><div class="small">{% block doc_numero %}{% endblock %}</div></div>
  </div>
  {% block cuerpo %}{% endblock %}
  <div class="small text-muted mt-4">Documento generado el {% now "d/m/Y H:i" %}. Documento de simulación académica: no tiene validez clínica, tributaria ni legal.</div>
</div></body></html>
